<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>California Housing Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="page">

        <div class="card">

            <div class="header">
                <h1>California Housing</h1>
                <p>Enter the property details to predict the house value.</p>
            </div>

            <form action="/predict" method="POST">

                <div class="form-grid">

                    {% for column in columns %}

                    <div class="form-group">

                        <label for="{{ column }}">
                            {{ column.replace('_', ' ').title() }}
                        </label>

                        <input
                            type="number"
                            step="any"
                            id="{{ column }}"
                            name="{{ column }}"
                            placeholder="Enter {{ column.replace('_', ' ') }}"
                            required
                        >

                    </div>

                    {% endfor %}

                </div>

                <button type="submit" class="predict-btn">
                    Predict House Value
                </button>

            </form>

            {% if prediction is defined %}

            <div class="result">
                <p>Predicted House Value</p>

                <h2>
                    ${{ "{:,.2f}".format(prediction) }}
                </h2>
            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
